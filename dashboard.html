<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — DigiVirasat</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css" />

  <style>
    body {
      background: var(--c-dark);
      color: var(--c-white);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--s-md);
      padding: var(--s-lg);
    }
    .dash-logo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--c-white);
    }
    .dash-logo span { color: var(--c-accent); }
    .dash-card {
      background: var(--c-mid);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      padding: var(--s-lg) var(--s-xl);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .dash-card h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--c-white);
      margin-bottom: 0.5rem;
    }
    .dash-card p {
      color: var(--c-white-55);
      font-size: 0.9rem;
      margin-bottom: var(--s-lg);
    }
    .dash-user {
      font-size: 0.85rem;
      color: var(--c-accent-lt);
      margin-bottom: var(--s-md);
      word-break: break-all;
    }
    .dash-badge {
      display: inline-block;
      background: var(--c-accent-dark-bg);
      border: 1px solid var(--c-accent-glow);
      color: var(--c-accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.875rem;
      border-radius: var(--r-pill);
      margin-bottom: var(--s-md);
    }
  </style>
</head>
<body>

  <div class="dash-logo">DigiVirasat<span>.</span></div>

  <div class="dash-card" id="dash-content" style="display:none">
    <div class="dash-badge">✓ Authenticated</div>
    <h2>Welcome to your Vault</h2>
    <p id="dash-greeting">Your secure digital legacy vault is being set up.</p>
    <p class="dash-user" id="dash-user-info"></p>
    <p style="color: var(--c-white-30); font-size: 0.8rem; margin-bottom: var(--s-md);">
      Dashboard coming soon — your account is active and ready.
    </p>
    <button class="btn btn-outline" id="logout-btn" style="margin: 0 auto; display:flex;">
      Sign Out
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyB4D7xjfOELTYwKvEMpr1P0IP6lTvM6bRc",
      authDomain:        "digiviraasat.firebaseapp.com",
      projectId:         "digiviraasat",
      storageBucket:     "digiviraasat.firebasestorage.app",
      messagingSenderId: "77734538548",
      appId:             "1:77734538548:web:3422873609ebbf803b4961"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Guard: bounce unauthenticated users
    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }
      const content  = document.getElementById('dash-content');
      const greeting = document.getElementById('dash-greeting');
      const userInfo = document.getElementById('dash-user-info');

      const name = user.displayName || 'there';
      greeting.textContent = `Hey ${name}, your secure digital legacy vault is ready.`;
      userInfo.textContent = user.email || user.phoneNumber || '';
      content.style.display = 'block';
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'auth.html';
    });
  </script>

</body>
</html>
